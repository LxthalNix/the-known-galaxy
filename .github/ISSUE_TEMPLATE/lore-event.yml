# Generated by npm run lore:sync; edit scripts/lore-form.mjs instead.
name: Submit or update a lore event
description: Submit lore with automatic checks, editorial review, image import, and a draft pull request.
title: "[Lore] "
body:
  - type: markdown
    attributes:
      value: |-
        ## Contribute to The Known Galaxy
        Submit the complete proposed event below. Automated checks give feedback; an editor with repository write access can then request a draft with `/prepare-lore`. A human reviews the preview and merges the pull request. Submitting, editing, or closing an issue does not publish it.

        All submissions and attachments are public. Use Markdown paragraphs, headings, and lists; HTML scripts and embedded widgets are removed. Avoid headings exactly matching the form's field labels inside your article. See the [complete field reference](https://github.com/LxthalNix/the-known-galaxy/blob/main/docs/CONTENT_REFERENCE.md) and [reviewer guide](https://github.com/LxthalNix/the-known-galaxy/blob/main/docs/ADDING_AN_EVENT.md).

        ## What “approved locations and names” means
        There is no separate authoritative location or character catalogue supplied to this repository. These lists are exact spellings already used in published, non-demo metadata, not a complete Star Wars or Roblox canon list. Reuse a spelling when referring to the same entity. A new location, building, or character is allowed only when supported by community lore and accepted by an editor; explain the evidence under Lore sources and approval. Do not invent names to fill empty fields. Leave irrelevant lists blank.

        **Currently recorded locations**
        - Crucible Prime
        - Dathomir
        - Ossus
        - Spintir

        **Currently recorded characters**
        - Darth Cronos
        - Darth Validus

        A location is a named place involved in the event; a character is a named individual involved in it. Factions and organizations belong in the article or faction field, not the character list. These lists are generated from `src/content/events/`; editors run `npm run lore:sync` after content changes.

        ## Existing records for updates and related events
        Related events must come from this published record list. Paste one exact slug or full event link per line, never a display title. Do not refer to the event itself or to unpublished drafts. Do not infer a relationship just to populate the field.
        - [Creation of the KAA](https://lxthalnix.github.io/the-known-galaxy/#creation-of-the-kaa) — `creation-of-the-kaa`
        - [Destruction of the Grand Jedi Library on Ossus](https://lxthalnix.github.io/the-known-galaxy/#destruction-of-ossus-library) — `destruction-of-ossus-library`
        - [Jedi Escape to the Dawn Temple on Spintir](https://lxthalnix.github.io/the-known-galaxy/#jedi-escape-to-the-dawn-temple-on-spintir) — `jedi-escape-to-the-dawn-temple-on-spintir`
        - [The Purge of Dathomir](https://lxthalnix.github.io/the-known-galaxy/#purge-of-dathomir) — `purge-of-dathomir`
        - [Rise of Darth Cronos](https://lxthalnix.github.io/the-known-galaxy/#rise-of-darth-cronos) — `rise-of-darth-cronos`
        - [Rise of Darth Validus](https://lxthalnix.github.io/the-known-galaxy/#rise-of-darth-validus) — `rise-of-darth-validus`
  - type: dropdown
    id: request-kind
    attributes:
      label: Request type
      description: Choose New event or supply a complete replacement for an existing event.
      options:
        - New event
        - Update an existing event
    validations:
      required: true
  - type: input
    id: existing-event
    attributes:
      label: Existing event link
      description: "Required for updates; leave blank for new events. Choose a published record listed above. Paste its exact slug or full website link including #slug. The existing slug is preserved so old links work."
      placeholder: https://lxthalnix.github.io/the-known-galaxy/#purge-of-dathomir
    validations:
      required: false
  - type: input
    id: event-title
    attributes:
      label: Event title
      description: The proposed public title, up to 120 characters. For a new event the workflow generates a unique lowercase, hyphenated slug from this title; titles matching existing events require an update request.
    validations:
      required: true
  - type: markdown
    attributes:
      value: |-
        ## Two calendars, one chronology
        Choose the calendar you know; do not submit the same event twice. BBD/ABD counts before/after the Battle of Dathomir. BDO/ADO counts before/after the Destruction of Ossus. Ossus is 16 ABD = 0 ADO; the Battle of Dathomir is 0 ABD = 16 BDO. Both advance by one canonical year per real calendar month, regardless of month length.

        The workflow automatically converts either calendar to the shared BBD/ABD event metadata before checking the era and same-year order. The website's Jedi view derives BDO/ADO; Sith and Neutral use BBD/ABD. Only one date is stored, so they cannot drift apart. For example, 1 ADO = 17 ABD and 1 BDO = 15 ABD. Origins use the after-calendar: 0 ABD or 0 ADO, never 0 BBD or 0 BDO.

        **Era conversion reference** (inclusive endpoints; the dropdown retains Dathomir dates for compatibility):

        | Era | Dathomir calendar | Ossus calendar |
        | --- | --- | --- |
        | The Unfamiliar and Unknown | 31 BBD to 20 BBD | 47 BDO to 36 BDO |
        | The Eminence | 19 BBD to 1 BBD | 35 BDO to 17 BDO |
        | Exodus and Recovery | 0 ABD to 16 ABD | 16 BDO to 0 ADO |
        | Hallowed Preparations | 17 ABD to 28 ABD | 1 ADO to 12 ADO |
        | Era of Expansion | 29 ABD to 40 ABD | 13 ADO to 24 ADO |
        | Uncharted Territory | 41 ABD to onward | 25 ADO to onward |
  - type: input
    id: year
    attributes:
      label: Year
      description: Whole number of zero or greater, without a minus sign or calendar suffix. Choose BBD, ABD, BDO, or ADO separately. Enter 0 ABD for Dathomir or 0 ADO for Ossus; 0 BBD and 0 BDO are invalid.
      placeholder: "17"
    validations:
      required: true
  - type: dropdown
    id: calendar
    attributes:
      label: Calendar
      description: BBD/ABD = Before/After the Battle of Dathomir (Sith calendar). BDO/ADO = Before/After the Destruction of Ossus (Jedi calendar). Either choice is converted automatically to the same canonical date. BBY/ABY are not accepted.
      options:
        - BBD
        - ABD
        - BDO
        - ADO
    validations:
      required: true
  - type: dropdown
    id: era
    attributes:
      label: Era
      description: Choose the era containing the converted canonical date. The dropdown displays Dathomir dates; the table above gives each range in the Jedi calendar. Both endpoints are inclusive. Options come from src/data/eras.ts; checks convert first and reject mismatches. Dates before 31 BBD / 47 BDO require an editorial chronology change first.
      options:
        - The Unfamiliar and Unknown (31 BBD–20 BBD)
        - The Eminence (19 BBD–1 BBD)
        - Exodus and Recovery (0 ABD–16 ABD)
        - Hallowed Preparations (17 ABD–28 ABD)
        - Era of Expansion (29 ABD–40 ABD)
        - Uncharted Territory (41 ABD–onward)
    validations:
      required: true
  - type: dropdown
    id: factions
    attributes:
      label: Factions
      description: Select Jedi, Sith, or both. These are the only archive faction categories, from src/data/factions.ts. Both creates a crossover record. Describe other organizations in the article; a new filter category needs an editorial configuration change.
      multiple: true
      options:
        - Jedi
        - Sith
    validations:
      required: true
  - type: dropdown
    id: event-types
    attributes:
      label: Event types
      description: "Select all applicable categories from src/data/eventTypes.ts: Political (leadership or governance), Military (conflict or armed forces), Discovery (finding or exploring), Personal (an individual milestone), Other (none of those). These are fixed categories, not existing event names."
      multiple: true
      options:
        - Political
        - Military
        - Discovery
        - Personal
        - Other
    validations:
      required: true
  - type: dropdown
    id: importance
    attributes:
      label: Importance
      description: Major = a defining turning point; Standard = a normal archive record; Minor = a smaller supporting occurrence. The editor confirms this presentation choice; it does not establish canon.
      options:
        - Major
        - Standard
        - Minor
      default: 1
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: Short summary
      description: One or two factual sentences, up to 500 characters, for the timeline and search. Put detailed narrative in the article.
    validations:
      required: true
  - type: textarea
    id: article
    attributes:
      label: Full event article
      description: Complete proposed Markdown article, up to 30,000 characters. For an update, provide the whole replacement, not just a list of edits. Separate uncertain claims from established facts in the sources field. Supporting attachments are not automatically embedded in the article.
    validations:
      required: true
  - type: markdown
    attributes:
      value: |-
        ## Optional faction accounts
        The full event article above is the canonical account. Separate Jedi and Sith articles are optional; they change narrative, title and summary only. Dates, era, factions, images, significance and related events always come from the same event. Do not submit a second event for another perspective. If no account is published, that view clearly falls back to the canonical account. For updates, Keep preserves any existing account; Remove returns that view to canonical fallback. Explain the sources and approval for each account below.
  - type: dropdown
    id: jedi-account-action
    attributes:
      label: Jedi account action
      description: Optional. Keep existing account / no new account, replace the complete account, or remove it from publication. Blank fields from an older form mean Keep.
      options:
        - Keep existing account / no new account
        - Add or replace account
        - Remove existing account
      default: 0
    validations:
      required: false
  - type: input
    id: jedi-account-title
    attributes:
      label: Jedi account title
      description: "Optional when adding/replacing: up to 120 characters. Blank uses the canonical event title. Otherwise leave blank."
    validations:
      required: false
  - type: textarea
    id: jedi-account-summary
    attributes:
      label: Jedi account summary
      description: "Optional when adding/replacing: up to 500 characters. Blank uses the canonical summary. Otherwise leave blank."
    validations:
      required: false
  - type: textarea
    id: jedi-account-article
    attributes:
      label: Jedi account article
      description: "Required only for Add or replace account: the complete proposed Markdown account, up to 30,000 characters. Avoid headings matching any form label. Otherwise leave blank."
    validations:
      required: false
  - type: dropdown
    id: sith-account-action
    attributes:
      label: Sith account action
      description: Optional. Keep existing account / no new account, replace the complete account, or remove it from publication. Blank fields from an older form mean Keep.
      options:
        - Keep existing account / no new account
        - Add or replace account
        - Remove existing account
      default: 0
    validations:
      required: false
  - type: input
    id: sith-account-title
    attributes:
      label: Sith account title
      description: "Optional when adding/replacing: up to 120 characters. Blank uses the canonical event title. Otherwise leave blank."
    validations:
      required: false
  - type: textarea
    id: sith-account-summary
    attributes:
      label: Sith account summary
      description: "Optional when adding/replacing: up to 500 characters. Blank uses the canonical summary. Otherwise leave blank."
    validations:
      required: false
  - type: textarea
    id: sith-account-article
    attributes:
      label: Sith account article
      description: "Required only for Add or replace account: the complete proposed Markdown account, up to 30,000 characters. Avoid headings matching any form label. Otherwise leave blank."
    validations:
      required: false
  - type: textarea
    id: locations
    attributes:
      label: Locations
      description: "Optional: one plain place name per line. Reuse an exact spelling from the recorded location list above when applicable. A sourced new name is permitted pending editorial approval. Leave blank if no named place is involved; do not enter [] or URLs."
    validations:
      required: false
  - type: textarea
    id: characters
    attributes:
      label: Characters
      description: "Optional: one plain individual name per line. Reuse an exact spelling from the recorded character list above when applicable. A sourced new character is permitted pending editorial approval. Leave blank if no named individual is involved; do not enter Jedi, Sith, organizations, [] or URLs."
    validations:
      required: false
  - type: textarea
    id: related-events
    attributes:
      label: Related events
      description: "Optional: one exact published slug or full event link per line, chosen from the list above. Display titles such as Destruction of Ossus are not valid references. Leave blank if no explicit lore relationship is established."
    validations:
      required: false
  - type: input
    id: timeline-order
    attributes:
      label: Same-year order
      description: "Optional integer for ordering events in the same converted canonical year, regardless of the submitted calendar: smaller numbers come first. For example, 1 ADO and 17 ABD share a year. New records default to 0; updates retain the previous value if blank. Equal values use slug order. Ask an editor if the sequence is uncertain."
      placeholder: "0"
    validations:
      required: false
  - type: textarea
    id: chronology-notes
    attributes:
      label: Chronology notes
      description: Optional explanation of same-year ordering or date uncertainty, for reviewers. Notes stay in this issue and do not become event metadata.
    validations:
      required: false
  - type: dropdown
    id: image-action
    attributes:
      label: Image action
      description: Images are optional. For updates, retain, replace, or remove the current main image. New events using Keep have no image. The main image and explicit gallery slots are imported; supporting attachments remain evidence.
      options:
        - Keep existing image / no new image
        - Add or replace main image
        - Remove existing image
      default: 0
    validations:
      required: true
  - type: textarea
    id: main-image
    attributes:
      label: Main image attachment
      description: Required only for Add or replace. Upload or paste ONE PNG, JPEG, or WebP image here, or paste its GitHub attachment URL. The workflow accepts GitHub-hosted attachments up to 10 MiB and 40 million pixels, converts them to optimized WebP, and stores a local /images/events/ path. SVG, GIF, PDF, remote image hosts, and videos are not main images. Do not enter public/ paths or repository filenames.
    validations:
      required: false
  - type: input
    id: image-alt
    attributes:
      label: Main image alt text
      description: Required when adding or replacing an image. Describe what readers should understand from it, up to 500 characters. This is accessible text, not the filename.
    validations:
      required: false
  - type: textarea
    id: image-credit
    attributes:
      label: Main image source and permission
      description: Required when adding or replacing an image. State its creator or source and why the community may publish it. This evidence stays in the issue for editorial review.
    validations:
      required: false
  - type: markdown
    attributes:
      value: |-
        ## Optional image gallery
        The main image appears first, followed by gallery images in the numbered field order. A gallery also works without a main image. Add or replace gallery replaces the complete existing gallery, using up to three images in this form; leave unused slots blank. Keep preserves all existing images, including galleries longer than three. Remove removes only the gallery, not the main image. More than three additional images can be added by an editor in the event file. Each uploaded image has the same 10 MiB / 40 million pixel PNG, JPEG or WebP restrictions as the main image. Supply accurate alt text for every image; captions are optional public text, while source/permission evidence stays in this issue.
  - type: dropdown
    id: gallery-action
    attributes:
      label: Gallery action
      description: Optional. Choose Keep, Add or replace, or Remove. Leave all image-slot fields blank unless adding/replacing.
      options:
        - Keep existing gallery / no new gallery
        - Add or replace gallery
        - Remove existing gallery
      default: 0
    validations:
      required: false
  - type: textarea
    id: gallery-1-image
    attributes:
      label: Gallery image 1 attachment
      description: Upload or paste ONE GitHub-hosted PNG, JPEG or WebP image, as for Main image attachment. Use slots in the order readers should see them. Leave unused slots blank.
    validations:
      required: false
  - type: input
    id: gallery-1-alt
    attributes:
      label: Gallery image 1 alt text
      description: Required if this slot has an image. Describe its content, up to 500 characters.
    validations:
      required: false
  - type: input
    id: gallery-1-caption
    attributes:
      label: Gallery image 1 caption
      description: Optional public caption, up to 500 characters. Leave blank if unnecessary.
    validations:
      required: false
  - type: textarea
    id: gallery-2-image
    attributes:
      label: Gallery image 2 attachment
      description: Upload or paste ONE GitHub-hosted PNG, JPEG or WebP image, as for Main image attachment. Use slots in the order readers should see them. Leave unused slots blank.
    validations:
      required: false
  - type: input
    id: gallery-2-alt
    attributes:
      label: Gallery image 2 alt text
      description: Required if this slot has an image. Describe its content, up to 500 characters.
    validations:
      required: false
  - type: input
    id: gallery-2-caption
    attributes:
      label: Gallery image 2 caption
      description: Optional public caption, up to 500 characters. Leave blank if unnecessary.
    validations:
      required: false
  - type: textarea
    id: gallery-3-image
    attributes:
      label: Gallery image 3 attachment
      description: Upload or paste ONE GitHub-hosted PNG, JPEG or WebP image, as for Main image attachment. Use slots in the order readers should see them. Leave unused slots blank.
    validations:
      required: false
  - type: input
    id: gallery-3-alt
    attributes:
      label: Gallery image 3 alt text
      description: Required if this slot has an image. Describe its content, up to 500 characters.
    validations:
      required: false
  - type: input
    id: gallery-3-caption
    attributes:
      label: Gallery image 3 caption
      description: Optional public caption, up to 500 characters. Leave blank if unnecessary.
    validations:
      required: false
  - type: textarea
    id: gallery-credit
    attributes:
      label: Gallery sources and permission
      description: Required when adding/replacing a gallery. Identify the creator/source and publication permission for each numbered image, up to 5,000 characters.
    validations:
      required: false
  - type: textarea
    id: attachments
    attributes:
      label: Supporting attachments
      description: "Optional images, documents, or other evidence: drag, paste, or upload here. Explain what each file supports. These files stay in the issue; only the explicit main-image and gallery fields are imported automatically."
    validations:
      required: false
  - type: textarea
    id: sources
    attributes:
      label: Lore sources and approval
      description: "Required: links to community lore records, supporting evidence, and the editor or approval status. If not approved, say Awaiting approval. Explain new names, changes to an existing record, and uncertainty. A form submission is not approval. Sources stay in the issue; include any sources readers should see in the article itself."
    validations:
      required: true
  - type: markdown
    attributes:
      value: |-
        ## Fields prepared by the workflow
        You do not edit YAML: the workflow sets title, slug, year, calendar, timelineOrder, era, factions, types, importance, summary, image/imageAlt, gallery entries, locations, characters, and relatedEvents from this form. Optional faction accounts are prepared as separate files in src/content/perspectives/ and share the canonical event metadata. Year/calendar are normalized to the single canonical BBD/ABD date even when you submit BDO/ADO; the workflow feedback shows both dates. It adds submissionIssue and submissionBodySha for tracking. New slugs are generated; update slugs are retained. Generated accepted lore uses draft: false and demo: false, inside a draft pull request that still needs review and merge. This form accepts canonical submissions only; demo records and unpublished drafts use the maintainer file-editing route.
  - type: checkboxes
    id: review
    attributes:
      label: Review process
      options:
        - label: I understand that new names and facts need sources and editorial approval, and this proposal appears on the website only after a reviewed pull request is merged and deployed.
          required: true
