# Generated by npm run lore:sync; edit scripts/lore-form.mjs instead.
name: Submit or update a lore event
description: Submit lore with automatic checks, editorial review, image import, and a draft pull request.
title: "[Lore] "
body:
  - type: markdown
    attributes:
      value: |-
        ## Contribute to The Known Galaxy
        Submit the complete proposed event below. Automated checks give feedback; an editor with repository write access can then request a draft with `/prepare-lore`. A human reviews the preview and merges the pull request. Submitting, editing, or closing an issue does not publish it.

        All submissions and attachments are public. Use Markdown paragraphs, headings, and lists; HTML scripts and embedded widgets are removed. Avoid headings exactly matching the form's field labels inside your article. See the [complete field reference](https://github.com/LxthalNix/the-known-galaxy/blob/main/docs/CONTENT_REFERENCE.md) and [reviewer guide](https://github.com/LxthalNix/the-known-galaxy/blob/main/docs/ADDING_AN_EVENT.md).

        ## What “approved locations and names” means
        There is no separate authoritative location or character catalogue supplied to this repository. These lists are exact spellings already used in published, non-demo metadata, not a complete Star Wars or Roblox canon list. Reuse a spelling when referring to the same entity. A new location, building, or character is allowed only when supported by community lore and accepted by an editor; explain the evidence under Lore sources and approval. Do not invent names to fill empty fields. Leave irrelevant lists blank.

        **Currently recorded locations**
        - Crucible Prime
        - Dathomir
        - Ossus
        - Spintir

        **Currently recorded characters**
        - Darth Cronos
        - Darth Validus

        A location is a named place involved in the event; a character is a named individual involved in it. Factions and organizations belong in the article or faction field, not the character list. These lists are generated from `src/content/events/`; editors run `npm run lore:sync` after content changes.

        ## Existing records for updates and related events
        Related events must come from this published record list. Paste one exact slug or full event link per line, never a display title. Do not refer to the event itself or to unpublished drafts. Do not infer a relationship just to populate the field.
        - [Creation of the KAA](https://lxthalnix.github.io/the-known-galaxy/#creation-of-the-kaa) — `creation-of-the-kaa`
        - [Destruction of the Grand Jedi Library on Ossus](https://lxthalnix.github.io/the-known-galaxy/#destruction-of-ossus-library) — `destruction-of-ossus-library`
        - [The Purge of Dathomir](https://lxthalnix.github.io/the-known-galaxy/#purge-of-dathomir) — `purge-of-dathomir`
        - [Rise of Darth Cronos](https://lxthalnix.github.io/the-known-galaxy/#rise-of-darth-cronos) — `rise-of-darth-cronos`
        - [Rise of Darth Validus](https://lxthalnix.github.io/the-known-galaxy/#rise-of-darth-validus) — `rise-of-darth-validus`
  - type: dropdown
    id: request-kind
    attributes:
      label: Request type
      description: Choose New event or supply a complete replacement for an existing event.
      options:
        - New event
        - Update an existing event
    validations:
      required: true
  - type: input
    id: existing-event
    attributes:
      label: Existing event link
      description: "Required for updates; leave blank for new events. Choose a published record listed above. Paste its exact slug or full website link including #slug. The existing slug is preserved so old links work."
      placeholder: https://lxthalnix.github.io/the-known-galaxy/#purge-of-dathomir
    validations:
      required: false
  - type: input
    id: event-title
    attributes:
      label: Event title
      description: The proposed public title, up to 120 characters. For a new event the workflow generates a unique lowercase, hyphenated slug from this title; titles matching existing events require an update request.
    validations:
      required: true
  - type: input
    id: year
    attributes:
      label: Year
      description: Whole number of zero or greater, without a minus sign, BBD, ABD, or BBY. Choose the calendar separately. The Battle of Dathomir is 0 ABD; 0 BBD is invalid.
      placeholder: "17"
    validations:
      required: true
  - type: dropdown
    id: calendar
    attributes:
      label: Calendar
      description: BBD = Before the Battle of Dathomir; ABD = After the Battle of Dathomir. Earlier BBD years run toward 0 ABD. BBY/ABY are background context and are not accepted as event dates.
      options:
        - BBD
        - ABD
    validations:
      required: true
  - type: dropdown
    id: era
    attributes:
      label: Era
      description: Choose the range containing the year and calendar. Both endpoints are inclusive. Options come from src/data/eras.ts; automated checks reject mismatches. Dates before 31 BBD require an editorial chronology change first.
      options:
        - The Unfamiliar and Unknown (31 BBD–20 BBD)
        - The Eminence (19 BBD–1 BBD)
        - Exodus and Recovery (0 ABD–16 ABD)
        - Hallowed Preparations (17 ABD–28 ABD)
        - Era of Expansion (29 ABD–40 ABD)
        - To Be Determined (41 ABD–onward)
    validations:
      required: true
  - type: dropdown
    id: factions
    attributes:
      label: Factions
      description: Select Jedi, Sith, or both. These are the only archive faction categories, from src/data/factions.ts. Both creates a crossover record. Describe other organizations in the article; a new filter category needs an editorial configuration change.
      multiple: true
      options:
        - Jedi
        - Sith
    validations:
      required: true
  - type: dropdown
    id: event-types
    attributes:
      label: Event types
      description: "Select all applicable categories from src/data/eventTypes.ts: Political (leadership or governance), Military (conflict or armed forces), Discovery (finding or exploring), Personal (an individual milestone), Other (none of those). These are fixed categories, not existing event names."
      multiple: true
      options:
        - Political
        - Military
        - Discovery
        - Personal
        - Other
    validations:
      required: true
  - type: dropdown
    id: importance
    attributes:
      label: Importance
      description: Major = a defining turning point; Standard = a normal archive record; Minor = a smaller supporting occurrence. The editor confirms this presentation choice; it does not establish canon.
      options:
        - Major
        - Standard
        - Minor
      default: 1
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: Short summary
      description: One or two factual sentences, up to 500 characters, for the timeline and search. Put detailed narrative in the article.
    validations:
      required: true
  - type: textarea
    id: article
    attributes:
      label: Full event article
      description: Complete proposed Markdown article, up to 30,000 characters. For an update, provide the whole replacement, not just a list of edits. Separate uncertain claims from established facts in the sources field. Supporting attachments are not automatically embedded in the article.
    validations:
      required: true
  - type: textarea
    id: locations
    attributes:
      label: Locations
      description: "Optional: one plain place name per line. Reuse an exact spelling from the recorded location list above when applicable. A sourced new name is permitted pending editorial approval. Leave blank if no named place is involved; do not enter [] or URLs."
    validations:
      required: false
  - type: textarea
    id: characters
    attributes:
      label: Characters
      description: "Optional: one plain individual name per line. Reuse an exact spelling from the recorded character list above when applicable. A sourced new character is permitted pending editorial approval. Leave blank if no named individual is involved; do not enter Jedi, Sith, organizations, [] or URLs."
    validations:
      required: false
  - type: textarea
    id: related-events
    attributes:
      label: Related events
      description: "Optional: one exact published slug or full event link per line, chosen from the list above. Display titles such as Destruction of Ossus are not valid references. Leave blank if no explicit lore relationship is established."
    validations:
      required: false
  - type: input
    id: timeline-order
    attributes:
      label: Same-year order
      description: "Optional integer for ordering events with the same year and calendar: smaller numbers come first. New records default to 0; updates retain the previous value if blank. Equal values use slug order. Ask an editor if the sequence is uncertain."
      placeholder: "0"
    validations:
      required: false
  - type: textarea
    id: chronology-notes
    attributes:
      label: Chronology notes
      description: Optional explanation of same-year ordering or date uncertainty, for reviewers. Notes stay in this issue and do not become event metadata.
    validations:
      required: false
  - type: dropdown
    id: image-action
    attributes:
      label: Image action
      description: Images are optional. For updates, retain, replace, or remove the current main image. New events using Keep have no image. Only the selected main image is imported; other attachments remain evidence.
      options:
        - Keep existing image / no new image
        - Add or replace main image
        - Remove existing image
      default: 0
    validations:
      required: true
  - type: textarea
    id: main-image
    attributes:
      label: Main image attachment
      description: Required only for Add or replace. Upload or paste ONE PNG, JPEG, or WebP image here, or paste its GitHub attachment URL. The workflow accepts GitHub-hosted attachments up to 10 MiB and 40 million pixels, converts them to optimized WebP, and stores a local /images/events/ path. SVG, GIF, PDF, remote image hosts, and videos are not main images. Do not enter public/ paths or repository filenames.
    validations:
      required: false
  - type: input
    id: image-alt
    attributes:
      label: Main image alt text
      description: Required when adding or replacing an image. Describe what readers should understand from it, up to 500 characters. This is accessible text, not the filename.
    validations:
      required: false
  - type: textarea
    id: image-credit
    attributes:
      label: Main image source and permission
      description: Required when adding or replacing an image. State its creator or source and why the community may publish it. This evidence stays in the issue for editorial review.
    validations:
      required: false
  - type: textarea
    id: attachments
    attributes:
      label: Supporting attachments
      description: "Optional images, documents, or other evidence: drag, paste, or upload here. Explain what each file supports. These files stay in the issue; only Main image attachment is imported automatically."
    validations:
      required: false
  - type: textarea
    id: sources
    attributes:
      label: Lore sources and approval
      description: "Required: links to community lore records, supporting evidence, and the editor or approval status. If not approved, say Awaiting approval. Explain new names, changes to an existing record, and uncertainty. A form submission is not approval. Sources stay in the issue; include any sources readers should see in the article itself."
    validations:
      required: true
  - type: markdown
    attributes:
      value: |-
        ## Fields prepared by the workflow
        You do not edit YAML: the workflow sets title, slug, year, calendar, timelineOrder, era, factions, types, importance, summary, image/imageAlt, locations, characters, and relatedEvents from this form. It adds submissionIssue and submissionBodySha for tracking. New slugs are generated; update slugs are retained. Generated accepted lore uses draft: false and demo: false, inside a draft pull request that still needs review and merge. This form accepts canonical submissions only; demo records and unpublished drafts use the maintainer file-editing route.
  - type: checkboxes
    id: review
    attributes:
      label: Review process
      options:
        - label: I understand that new names and facts need sources and editorial approval, and this proposal appears on the website only after a reviewed pull request is merged and deployed.
          required: true
