name: Track published lore
on:
  workflow_run:
    workflows: [Deploy to GitHub Pages]
    types: [completed]
permissions:
  contents: read
  issues: write
concurrency:
  group: lore-publication
  cancel-in-progress: false
jobs:
  track:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Confirm submissions in the deployed revision
        uses: actions/github-script@v9
        with:
          script: |
            const { pathToFileURL } = await import('node:url');
            const { resolve } = await import('node:path');
            const { trackPublication } = await import(pathToFileURL(resolve('scripts/lore-github.mjs')).href);
            await trackPublication({ github, context });
